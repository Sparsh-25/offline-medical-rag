paths:
  raw:         data/raw/
  extracted:   data/extracted/
  chunks:      data/chunks/chunks.jsonl
  faiss_index: index/faiss.index
  bm25_index:  index/bm25.pkl

api:
  # ── Secrets go in .secrets/secrets.yaml (gitignored) ──────────
  # DO NOT put real API keys in this file.
  # See .secrets/secrets.yaml.example for the format.
  entrez_email: "your@email.com"   # override in .secrets/secrets.yaml

  # LLM backend: "groq" (cloud, 14,400 req/day free) | "ollama" (local, unlimited)
  llm_backend: "groq"

  groq:
    # api_key set in .secrets/secrets.yaml or GROQ_API_KEY env var
    model: "llama-3.1-8b-instant"     # 14,400 req/day free
    # model: "llama-3.3-70b-versatile" # 1,000 req/day free — higher quality

  ollama:
    base_url: "http://localhost:11434"
    model:    "llama3.1"              # brew install ollama && ollama pull llama3.1

extraction:
  export_figures:    true
  export_tables:     true
  image_resolution:  150              # dpi for figure PNGs
  save_docling_json: false            # lossless docling dict — 2-3MB/doc, debug only

chunking:
  split_on:        ["H1", "H2", "H3"]
  min_chunk_tokens: 80
  max_chunk_tokens: 512
  overlap_tokens:   0
  # VLM-generated figure captions are excluded from the corpus for now — 5
  # confirmed/likely fabrications found across 4 documents (decisions.md
  # D14/D30/D33/D34/D35), no resolution yet on the VLM model choice (D7) or
  # grounding-check gap. Flip back to true once that's resolved.
  include_figure_captions: false

embedding:
  # "symmetric" (default): one model embeds both queries and chunks (e.g. BAAI/bge-m3).
  # "asymmetric": separate query/article encoders, e.g. MedCPT — chosen 2026-08-14
  # over BGE-base/PubMedBERT/BGE-M3, see decisions.md D53/D55/D56.
  architecture: asymmetric
  model:
    query:   ncbi/MedCPT-Query-Encoder
    article: ncbi/MedCPT-Article-Encoder
  # (symmetric example, kept for reference — see eval/compare-embedding-models/bge_m3/
  # for how to reproduce this exact config: `model: BAAI/bge-m3`, no `architecture` line needed)
  batch_size: 32
  device:     cpu
  index_type: flat   # "flat" (IndexFlatIP, exact) | "hnsw" (IndexHNSWFlat, approximate) — see decisions.md D4/D22

recency:
  baseline_year: 2015                 # weight 0.5 at or before this
  peak_year:     2024                 # weight 1.0 at or after this

retrieval:
  mode:           hybrid  # "dense" | "hybrid" (weighted score fusion) | "rrf" (rank fusion) — see decisions.md D45
  top_k:          5       # final results returned to the caller
  candidate_pool: 50      # how many results each of dense/sparse pulls before fusion — raised
                           # from 20 for MedCPT specifically, see decisions.md D53/D55/D56
  rrf_k:          60      # RRF's rank-damping constant
  hybrid_alpha:   0.5     # "hybrid" mode weight on dense score; sparse gets (1 - hybrid_alpha)
  max_per_doc:    5       # diversity cap — see decisions.md D44 (loosened from 2: recall/diversity tradeoff)
  confidence_threshold: 0.647   # dense-mode cosine similarity "confident match" cutoff — see
                                 # decisions.md D57 for the 4-tier calibration this came from (the
                                 # lowest score among content-verified "partial/borderline" matches).
                                 # Diagnostic use only (src/verify.py) — NOT wired into answer-time
                                 # abstention logic yet; Tier 2 (generic oncology queries) showed this
                                 # value still lets some genuinely-wrong matches through.

vlm:
  # Ollama model used by caption.py for figure extraction.
  # Change to "llava:13b", "llava-phi3", "bakllava", etc. — no code change needed.
  model:    "llava"
  timeout:  300                       # seconds per image (complex figures may need more)
  base_url: "http://localhost:11434"  # Ollama daemon URL