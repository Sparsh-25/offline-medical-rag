<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oncology RAG — live test</title>
  <style>
    :root { --bg:#f7f7f8; --card:#fff; --line:#e3e3e8; --ink:#1a1a1f; --muted:#6b6b75; --accent:#2f6f4f; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--ink); }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 20px; margin: 8px 0 2px; }
    p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    form { display: flex; gap: 8px; }
    textarea { flex:1; padding:12px; border:1px solid var(--line); border-radius:8px;
               font: inherit; resize: vertical; min-height: 52px; background: var(--card); }
    button { padding: 0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff;
             font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .status { color: var(--muted); font-size: 14px; margin: 16px 2px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:16px 18px; margin-top:16px; }
    .answer { white-space: pre-wrap; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
    h2 { font-size: 14px; letter-spacing:.03em; text-transform: uppercase; color: var(--muted);
         margin: 24px 2px 8px; }
    .src { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; background:var(--card); }
    .src .hd { font-size: 13px; color: var(--accent); font-weight:600; }
    .src .snip { font-size: 13px; color:#333; margin-top:6px; max-height: 7.5em; overflow:auto; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Offline Oncology RAG — live test</h1>
  <p class="sub">Type a breast-cancer question. It runs the real pipeline on the GPU box:
     retrieve → rerank → safety-net → Qwen3-32B. Answers are grounded only in the corpus.</p>

  <form id="form">
    <textarea id="q" placeholder="e.g. What is the recommended first-line treatment for PIK3CA-mutated HR+/HER2- metastatic breast cancer?"></textarea>
    <button id="go" type="submit">Ask</button>
  </form>

  <div id="status" class="status"></div>
  <div id="result"></div>
</main>

<script>
  const form = document.getElementById("form");
  const qEl = document.getElementById("q");
  const goEl = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  function escapeHtml(s) {
    return (s || "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = qEl.value.trim();
    if (!query) return;

    goEl.disabled = true;
    resultEl.innerHTML = "";
    statusEl.textContent = "Generating… the 32B model is slow, this can take 10–40 seconds.";

    try {
      // Relative path so it works under Jupyter's /proxy/8000/ prefix.
      const resp = await fetch("ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      statusEl.textContent = "";
      let html = `<div class="card"><div class="answer">${escapeHtml(data.answer)}</div>` +
                 `<div class="meta">answered in ${data.seconds}s · ${data.sources.length} sources</div></div>`;
      if (data.sources.length) {
        html += `<h2>Sources the answer was grounded in</h2>`;
        for (const s of data.sources) {
          html += `<div class="src"><div class="hd">[${s.rank}] ${escapeHtml(s.doc_id)} · §${escapeHtml(s.section || "")}</div>` +
                  `<div class="snip">${escapeHtml(s.snippet || "")}</div></div>`;
        }
      }
      resultEl.innerHTML = html;
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
    } finally {
      goEl.disabled = false;
    }
  });
</script>
</body>
</html>
